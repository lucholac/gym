<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#080810">
<title>Training Log</title>
<link id="mfst" rel="manifest">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#06060F;color:#FFFFFF;font-family:'Barlow',sans-serif;overscroll-behavior:none;font-size:16px}
#app{min-height:100vh;padding-bottom:60px}
input{background:#12121E;border:1.5px solid #222236;border-radius:8px;color:#FFFFFF;font-family:'Barlow',sans-serif;font-size:15px;padding:11px 12px;-webkit-appearance:none;width:100%}
input::placeholder{color:#555566}
input:focus{outline:none;border-color:#444460}
button{font-family:'Barlow Condensed',sans-serif;cursor:pointer;border:none}
button:active{transform:scale(0.95);opacity:0.8}
.bar-track{height:3px;background:#141428;border-radius:2px;margin-top:12px}
.bar-fill{height:100%;border-radius:2px;transition:width .5s}
.scroll-x{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;gap:8px}
.scroll-x::-webkit-scrollbar{display:none}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.up{animation:up .28s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:#0D0D1E;border-top:2px solid #1A1A30;border-radius:20px 20px 0 0;padding:22px 18px;max-height:92vh;overflow-y:auto}
.card{background:#0D0D1C;border:1.5px solid #181826;border-radius:13px;overflow:hidden;margin-bottom:11px}
.card-head{padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.ex-body{padding:0 14px 14px;border-top:1.5px solid #111120}
.desc-box{margin:10px 0 10px;padding:12px 13px;background:#090918;border-radius:8px;font-size:14px;color:#CCCCCC;line-height:1.65}
.yt-btn{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#FF0000;border-radius:9px;color:#FFFFFF;font-weight:700;font-size:15px;font-family:'Barlow',sans-serif;letter-spacing:.3px;margin-bottom:12px;text-decoration:none;width:100%;justify-content:center}
.set-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #0D0D1C;flex-wrap:wrap}
.set-input-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.add-btn{padding:11px 16px;border-radius:8px;color:#000;font-weight:900;font-size:15px;font-family:'Barlow Condensed',sans-serif;flex-shrink:0;letter-spacing:.5px}
.tab-btn{padding:8px 18px;border-radius:22px;font-size:13px;font-weight:800;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif}
.hist-week{background:#0C0C1A;border-radius:11px;overflow:hidden;border:1.5px solid #111120;margin-bottom:13px}
.hist-head{padding:12px 14px;background:#0F0F1E;display:flex;justify-content:space-between;align-items:center}
.hist-day{padding:10px 14px;border-bottom:1px solid #0D0D1C}
.set-badge{font-size:12px;padding:3px 9px;background:#111120;border-radius:20px;color:#888899}
.ai-equip{flex:1;padding:14px;border-radius:10px;font-weight:700;font-size:15px;font-family:'Barlow Condensed',sans-serif}
.ai-ex-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #111120}
.ai-btn-row{display:flex;gap:9px;margin-top:16px}
.pill{flex:0 0 auto;min-width:54px;padding:9px 5px;border-radius:10px;text-align:center;cursor:pointer}
</style>
</head>

function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function load(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function todayKey(){return['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][new Date().getDay()];}
function weekId(){const n=new Date(),j=new Date(n.getFullYear(),0,1),w=Math.ceil((((n-j)/86400000)+j.getDay()+1)/7);return n.getFullYear()+'-W'+w;}

let S={
  day:todayKey(),week:weekId(),
  logs:load(LOGS_KEY,{}),custom:load(CUSTOM_KEY,{}),
  openEx:null,tab:'workout',
  showAI:false,aiEquip:'gym',aiLoading:false,aiResult:null,aiErr:'',
  showSettings:false,apiKey:load(KEY_KEY,'')||'',
  saving:false,tempW:'',tempR:'',tempO:''
};
function setState(u){Object.assign(S,u);render();}
function exLogs(id){return S.logs[S.week]?.[S.day]?.[id]||[];}
function currentWorkout(){const p=PLANS[S.day],c=S.custom[S.week]?.[S.day];return(REST_DAYS.has(S.day)&&c)?{...c,isCustom:true}:p;}
function totalSets(){return Object.values(S.logs[S.week]?.[S.day]||{}).reduce((a,s)=>a+s.length,0);}
function completedCount(){return(currentWorkout().exercises||[]).filter(ex=>exLogs(ex.id).length>0).length;}
function pct(){const t=(currentWorkout().exercises||[]).length;return t?Math.round(completedCount()/t*100):0;}

function buildApp(){
  const wk=currentWorkout(),dc=WC[S.day],t=(wk.exercises||[]).length,cp=completedCount(),pp=pct(),ts=totalSets();
  const isRest=REST_DAYS.has(S.day)&&!S.custom[S.week]?.[S.day];
  return `
  <div style="background:linear-gradient(160deg,#0C0C1C,#0E0E24);border-bottom:2px solid #13132A;padding:20px 16px 16px">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div>
        <div style="font-size:11px;letter-spacing:4px;color:#555568;font-family:'Barlow Condensed';margin-bottom:5px">TRAINING LOG</div>
        <div style="font-size:38px;font-weight:900;letter-spacing:1px;line-height:1;color:${dc};font-family:'Barlow Condensed'">${DAY_FULL[S.day]}</div>
        <div style="font-size:15px;color:#AAAAAA;margin-top:5px">${DAY_SUB[S.day]}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:10px;letter-spacing:2px;color:#333355;font-family:'Barlow Condensed'">SEM ${S.week.split('W')[1]}</div>
        <div style="font-size:32px;font-weight:900;line-height:1;color:${S.saving?dc:'#FFFFFF'};font-family:'Barlow Condensed'">${S.saving?'●':(t===0?'—':pp+'%')}</div>
        ${t>0?`<div style="font-size:13px;color:#777788">${cp}/${t}</div>`:''}
        <button data-action="openSettings" style="background:#111120;border:1px solid #222236;border-radius:20px;color:#888899;font-size:12px;padding:5px 12px;margin-top:6px;letter-spacing:1px">⚙ API</button>
      </div>
    </div>
    ${t>0?`<div class="bar-track"><div class="bar-fill" style="width:${pp}%;background:${dc}"></div></div>`:''}
    ${wk.tip?`<div style="margin-top:12px;padding:9px 13px;background:#0A0A1C;border-left:4px solid ${dc};border-radius:0 8px 8px 0"><div style="font-size:14px;color:#DDDDDD;font-style:italic">${wk.tip}</div></div>`:''}
  </div>

  <div class="scroll-x" style="padding:12px 14px;border-bottom:1px solid #0E0E1C">
    ${DAYS.map(d=>{
      const isAct=d===S.day,isToday=d===todayKey(),wc=WC[d];
      const done=Object.values(S.logs[S.week]?.[d]||{}).some(s=>s.length>0),hasCust=!!S.custom[S.week]?.[d];
      return `<button data-action="setDay" data-day="${d}" class="pill" style="background:${isAct?wc:'#0C0C1C'};border:1.5px solid ${isToday&&!isAct?wc+'66':'#181826'}">
        <div style="font-size:13px;font-weight:900;letter-spacing:1px;color:${isAct?'#000':isToday?wc:'#AAAAAA'};font-family:'Barlow Condensed'">${d}</div>
        <div style="font-size:11px;color:${isAct?'#00000066':'#444466'};margin-top:2px">${hasCust?'★':done?'✓':isToday?'·':''}</div>
      </button>`;
    }).join('')}
  </div>

  <div style="display:flex;padding:12px 14px 0;gap:8px">
    ${[['workout','ENTRENO'],['history','HISTORIAL']].map(([v,l])=>`
      <button data-action="setTab" data-tab="${v}" class="tab-btn" style="background:${S.tab===v?dc:'#101018'};color:${S.tab===v?'#000':'#666677'}">${l}</button>
    `).join('')}
  </div>

  <div style="padding:14px">
    ${S.tab==='workout'?buildWorkoutTab(wk,dc,isRest,cp,ts,pp):''}
    ${S.tab==='history'?buildHistoryTab():''}
  </div>

  ${S.showAI?buildAIModal(dc):''}
  ${S.showSettings?buildSettingsModal(dc):''}
  `;
}

      <div style="font-size:56px">${S.day==='MAR'?'😴':'⚽'}</div>

      <div style="font-size:12px;letter-spacing:2px;color:#555566;margin-bottom:10px;font-family:'Barlow Condensed'">DESCANSO ACTIVO</div>
      ${['Caminata 20-30 min','Estiramiento global 15 min','Foam roller si tenés','Hidratación ++','Dormir 7-8h'].map(t=>`<div style="font-size:15px;color:#AAAAAA;padding:8px 0;border-bottom:1px solid #111120">→ ${t}</div>`).join('')}

      ${wk.isCustom?`<div style="font-size:13px;color:${dc}88;margin-top:3px">✦ Generado especialmente para hoy</div>`:''}

        ${[['Ejercicios',cp],['Sets totales',ts],['Completado',pp+'%']].map(([l,v])=>`<div><div style="font-size:28px;font-weight:900;color:${dc};line-height:1;font-family:'Barlow Condensed'">${v}</div><div style="font-size:13px;color:#666677">${l}</div></div>`).join('')}
      </div>
    </div>`:''}
  `;
}

    <div class="card-head" data-action="toggleEx" data-exid="${ex.id}">
      <div style="width:52px;height:52px;background:${mc}12;border-radius:9px;border:1.5px solid ${mc}28;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        ${illus(ex.type,mc,44)}

      <div style="flex:1;min-width:0">
        <div style="font-size:16px;font-weight:700;color:#FFFFFF;line-height:1.25">${ex.name}</div>

          <span style="color:${mc}">${ex.muscle}</span>

function buildHistoryTab(){

  return weeks.map(wk=>`
    <div class="hist-week">
      <div class="hist-head"><div style="font-size:16px;font-weight:900;letter-spacing:1px;font-family:'Barlow Condensed'">SEMANA ${wk.split('W')[1]}</div><div style="font-size:12px;color:#333344">${wk}</div></div>
      ${DAYS.filter(d=>{const dd=S.logs[wk]?.[d];return dd&&Object.values(dd).some(s=>s.length>0);}).map(d=>{
        const wc=WC[d],cust=S.custom[wk]?.[d],plan=PLANS[d];
        const workout=(REST_DAYS.has(d)&&cust)?cust:plan,dd=S.logs[wk][d];
        const sc=Object.values(dd).reduce((a,s)=>a+s.length,0);
        return `<div class="hist-day">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div style="font-size:15px;font-weight:800;color:${wc};font-family:'Barlow Condensed'">${DAY_FULL[d]} ${cust?'★':''}</div>
            <div style="font-size:13px;color:#555566">${Object.keys(dd).length} ej · ${sc} sets</div>
          </div>
          ${Object.entries(dd).map(([exId,sets])=>{
            if(!sets.length) return '';
            const ex=(workout?.exercises||[]).find(e=>e.id===exId);
            if(!ex) return '';
            const mc=MC[ex.muscle]||'#888';
            return `<div style="padding-left:12px;border-left:2px solid ${mc}33;margin-bottom:7px">
              <div style="font-size:13px;color:#AAAAAA">${ex.name}</div>
              <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px">
                ${sets.map(s=>`<span class="set-badge">${s.w?s.w+'kg × ':''}${s.r}</span>`).join('')}
              </div>
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

document.addEventListener('click',function(e){
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const a=btn.dataset.action;
  if(a==='setDay') setState({day:btn.dataset.day,openEx:null,tempW:'',tempR:'',tempO:''});
  else if(a==='setTab') setState({tab:btn.dataset.tab});
  else if(a==='toggleEx'){const id=btn.dataset.exid;setState({openEx:S.openEx===id?null:id,tempW:'',tempR:'',tempO:''});}
  else if(a==='addSet'){
    const exId=btn.dataset.exid,isCardio=btn.dataset.cardio==='1';
    const w=isCardio?'':document.getElementById('tw')?.value||'';
    const r=document.getElementById('tr')?.value||'';
    const o=document.getElementById('to')?.value||'';
    if(!w&&!r) return;
    const nl=JSON.parse(JSON.stringify(S.logs));
    if(!nl[S.week]) nl[S.week]={};
    if(!nl[S.week][S.day]) nl[S.week][S.day]={};
    if(!nl[S.week][S.day][exId]) nl[S.week][S.day][exId]=[];
    nl[S.week][S.day][exId].push({w,r,o,t:new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})});
    save(LOGS_KEY,nl);setState({logs:nl,tempW:'',tempR:'',tempO:''});
  }
  else if(a==='removeSet'){
    const exId=btn.dataset.exid,idx=parseInt(btn.dataset.idx);
    const nl=JSON.parse(JSON.stringify(S.logs));
    nl[S.week]?.[S.day]?.[exId]?.splice(idx,1);
    save(LOGS_KEY,nl);setState({logs:nl});
  }
  else if(a==='openAI') setState({showAI:true,aiResult:null,aiErr:''});
  else if(a==='closeAI') setState({showAI:false,aiResult:null});
  else if(a==='setEquip') setState({aiEquip:btn.dataset.equip});
  else if(a==='regenAI') setState({aiResult:null,aiErr:''});
  else if(a==='generateAI'){if(S.apiKey) doGenerate(); else setState({aiErr:'Configurá tu API Key primero.'});}
  else if(a==='saveAI'){
    const nc=JSON.parse(JSON.stringify(S.custom));
    if(!nc[S.week]) nc[S.week]={};
    nc[S.week][S.day]=S.aiResult;
    save(CUSTOM_KEY,nc);setState({custom:nc,showAI:false,aiResult:null,tab:'workout'});
  }
  else if(a==='openSettings') setState({showSettings:true});
  else if(a==='closeSettings') setState({showSettings:false});
  else if(a==='saveApiKey'){
    const k=document.getElementById('apiKeyInput')?.value||'';
    save(KEY_KEY,k);setState({apiKey:k,showSettings:false});
  }
  if(e.target.id==='aioverlay') setState({showAI:false,aiResult:null});
  if(e.target.id==='settingsoverlay') setState({showSettings:false});
});

async function doGenerate(){
  setState({aiLoading:true,aiErr:'',aiResult:null});
  const muscles=new Set();
  DAYS.forEach(d=>{
    if(d===S.day) return;
    const c=S.custom[S.week]?.[d],p=PLANS[d],wk=(REST_DAYS.has(d)&&c)?c:p;
    const dd=S.logs[S.week]?.[d]||{};
    Object.keys(dd).forEach(exId=>{const ex=(wk?.exercises||[]).find(e=>e.id===exId);if(ex&&dd[exId]?.length>0) muscles.add(ex.muscle);});
  });
  const eq=S.aiEquip==='gym'?'Gimnasio completo (mancuernas, barras, máquinas, cables)':'Mini gym en casa (mancuernas, banco, silla, peso corporal, sin barra)';
  const prompt=`Sos un entrenador personal experto. Generá un entrenamiento para hoy.\nPerfil: 1.81m, 93kg, meta 87kg con masa muscular. SIN sentadilla con barra. Equipamiento: ${eq}. Músculos trabajados esta semana: ${[...muscles].join(', ')||'ninguno'}.\nGenerá 6-8 ejercicios. Respondé SOLO con JSON válido sin texto extra:\n{"label":"NOMBRE","tip":"frase motivadora","exercises":[{"id":"gen_1","name":"nombre","sets":4,"reps":"10","muscle":"Grupo","type":"tipo","desc":"como ejecutarlo","isCardio":false}]}\nTipos: bench_press,incline_press,fly,shoulder_press,lateral_raise,tricep_ext,dip,pulldown,row,barbell_row,curl,leg_press,goblet_squat,lunge,leg_curl,leg_ext,hip_thrust,calf_raise,plank,pullover,pushup,cardio`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1500,messages:[{role:'user',content:prompt}]})});
    const data=await res.json();
    if(data.error) throw new Error(data.error.message);
    const text=data.content?.find(b=>b.type==='text')?.text||'';
    const parsed=JSON.parse(text.replace(/```json|```/g,'').trim());
    if(!parsed.exercises) throw new Error('bad format');
    setState({aiLoading:false,aiResult:parsed});
  }catch(err){setState({aiLoading:false,aiErr:'Error: '+(err.message||'Intentá de nuevo.')});}
}

function render(){document.getElementById('app').innerHTML=buildApp();}
render();
</script>
